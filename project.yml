name: Quotrack
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.2"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"

targets:
  Quotrack:
    type: application
    platform: macOS
    sources:
      - path: Quotrack
        excludes:
          - Info.plist
          - Quotrack.entitlements
    settings:
      base:
        PRODUCT_NAME: Quotrack
        PRODUCT_BUNDLE_IDENTIFIER: com.terry.quotrack
        INFOPLIST_FILE: Quotrack/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Quotrack/Quotrack.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: NO

  QuotrackTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: QuotrackTests
      - path: Quotrack/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terry.quotrack.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Quotrack:
    build:
      targets:
        Quotrack: all
        QuotrackTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: QuotrackTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
